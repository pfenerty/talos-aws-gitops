# Resource metrics for kubectl top and the HorizontalPodAutoscaler.
#
# Verifies kubelet serving certificates, which assumes the cluster was built
# with hardening.kubelet_serving_certificates (Terraform then installs the
# CSR approver that gets them signed). On a cluster without it the kubelets
# self-sign, and this needs `--kubelet-insecure-tls` added in the cluster's
# overlay, or it scrapes nothing.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: aws-cloud-controller-manager
    - name: prometheus-operator-crds
  chart:
    spec:
      chart: metrics-server
      version: 3.14.0
      sourceRef:
        kind: HelmRepository
        name: metrics-server
  targetNamespace: kube-system
  values:
    metrics:
      enabled: true
    serviceMonitor:
      enabled: true
