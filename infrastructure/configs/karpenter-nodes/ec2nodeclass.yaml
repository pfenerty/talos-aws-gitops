# What Karpenter launches. Every ${...} is substituted by the infra-configs
# Kustomization from Terraform's flux-system/karpenter-vars. node_user_data
# arrives JSON-encoded, which makes it one line of valid YAML (a double-quoted
# scalar), so it is used bare. Any literal `$` added to this directory must be
# written `$$`.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # A Talos image: Karpenter can't generate its user data. The machine config
  # Terraform renders carries the karpenter.sh/unregistered taint Karpenter
  # requires on nodes it launches.
  amiFamily: Custom
  amiSelectorTerms:
    - id: "${node_ami_id}"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${discovery_tag}"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "${discovery_tag}"
  # The existing worker profile; the IAM policy grants no profile management.
  instanceProfile: "${node_instance_profile}"
  # Public subnets and no NAT gateway: without an address a node can't pull
  # images or reach the API server.
  associatePublicIPAddress: true
  # Same as the launch templates: IMDSv2 only, hop limit 1, so pods can't
  # reach the node's credentials.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1
  blockDeviceMappings:
    - deviceName: /dev/xvda
      rootVolume: true
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  userData: ${node_user_data}
